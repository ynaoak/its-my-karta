  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="25" y="25" width="1150" height="580" rx="28" fill="none" stroke="#d7c3ee" stroke-width="2"/>
  <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
