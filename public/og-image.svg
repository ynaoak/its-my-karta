    <text x="392" y="519" text-anchor="middle" fill="#7952b7" font-size="19" font-weight="700">招待URLで最大12人</text>
    <text x="69" y="574" fill="#9680aa" font-size="16">yondetotte.oshi-katsu.com</text>
  </g>
