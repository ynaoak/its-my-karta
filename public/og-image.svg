<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">わたしのかるた — 配信の名言を、かるたに。</title>
  <desc id="desc">VTuberの参加型配信に。画像と自分の声で札をつくり、招待URLからリスナーと対戦できます。</desc>
  <rect width="1200" height="630" fill="#f7f6ef"/>
  <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#242622">
    <rect x="57" y="43" width="46" height="56" fill="#ffe04b" stroke="#242622" stroke-width="2"/>
    <text x="80" y="83" text-anchor="middle" font-size="36" font-weight="900">か</text>
    <text x="121" y="82" font-size="29" font-weight="900">わたしのかるた</text>
    <text x="372" y="80" font-size="15" fill="#5b6159">配信かるた制作室</text>
    <path d="M57 126H1143" stroke="#242622" stroke-width="3"/>
    <text x="57" y="190" font-size="18" font-weight="700">VTuberの参加型配信に。</text>
    <text x="57" y="291" font-size="65" font-weight="900">配信の名言を、</text>
    <text x="57" y="382" font-size="65" font-weight="900">かるたに。</text>
    <text x="60" y="443" font-size="20" fill="#51584c">いつもの挨拶、忘れられないひと言。</text>
    <text x="60" y="480" font-size="20" fill="#51584c">画像と自分の声を添えて、リスナーと遊ぶ札を。</text>
    <rect x="57" y="525" width="558" height="44" fill="#ffe04b"/>
    <text x="76" y="553" font-size="16" font-weight="700">参加者はログイン不要 ／ 1対戦12人まで ／ 最大46枚</text>
    <text x="1143" y="601" text-anchor="end" font-size="15" fill="#5b6159">yondetotte.oshi-katsu.com</text>
    <text x="724" y="185" font-size="16" font-weight="700">札の見本</text>
    <text x="1143" y="185" text-anchor="end" font-size="14" fill="#5b6159">「こ」の札</text>
    <path d="M724 201H1143" stroke="#242622"/>
    <rect x="724" y="221" width="202" height="286" fill="#ffe04b" stroke="#242622" stroke-width="2"/>
    <circle cx="892" cy="253" r="20" fill="#fffef9" stroke="#242622" stroke-width="2"/>
    <text x="892" y="266" text-anchor="middle" font-size="28" font-weight="700">こ</text>
    <path d="M745 361Q745 306 825 306Q905 306 905 361Q905 426 825 426H745Z" fill="#242622"/>
    <text x="825" y="355" text-anchor="middle" font-size="31" fill="#ffe04b" font-weight="700">こん</text>
    <text x="825" y="397" text-anchor="middle" font-size="38" fill="#ffe04b" font-weight="900">〇〇！</text>
    <text x="825" y="486" text-anchor="middle" font-size="13">取り札：好きな画像で</text>
    <rect x="944" y="221" width="199" height="286" fill="#fffef9" stroke="#242622" stroke-width="2"/>
    <g font-size="25" font-weight="700" writing-mode="vertical-rl"><text x="1100" y="244">こん〇〇！</text><text x="1054" y="244">いつもの声で</text><text x="1008" y="244">配信開始。</text></g>
    <text x="1043" y="487" text-anchor="middle" font-size="11">読み札：自分の声も録音できます</text>
  </g>
</svg>
