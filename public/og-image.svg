    <text x="65" y="386" fill="#d9367b" font-size="64" font-weight="900">みんなで、とる。</text>
    <text x="69" y="446" fill="#7e6b8b" font-size="21">配信の名言も、いつもの挨拶も、みんなのかるたに。</text>
    <rect x="65" y="488" width="190" height="47" rx="24" fill="#7650e8"/>
