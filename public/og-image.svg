<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">わたしのかるた</title>
  <desc id="desc">好きなことばで、わたしたちのかるた。50音の札づくりとオンライン対戦。</desc>
  <rect width="1200" height="630" fill="#f5f3eb"/>
  <rect x="25" y="25" width="1150" height="580" rx="18" fill="none" stroke="#dedfd4" stroke-width="2"/>
