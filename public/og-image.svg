    <text x="137" y="107" font-size="33" font-weight="700">わたしのかるた</text>
    <text x="65" y="235" font-size="24" fill="#6d806e">ことばと絵から、みんなの遊びへ。</text>
    <text x="65" y="325" font-size="55" font-weight="700">好きなことばで、</text>
